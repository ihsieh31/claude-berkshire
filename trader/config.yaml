# 波克夏式長期選股系統設定範例。
# 使用方式：cp config.example.yaml config.yaml 後再依需要修改。
# 注意：秘密（金鑰）不得寫在這裡；只寫環境變數名稱，實際值放在 .env 或系統環境變數。

account:
  initial_cash: 100000          # 初始資金（美元）
  slippage_bps: 10              # 滑價（基點）
  commission_per_order: 0       # 每筆委託手續費（美元）
  benchmark: SPY                # 基準指數 ETF

universe: sp500                 # 股票池

schedule:
  timezone: America/New_York
  daily_close: "17:30"          # 收盤後：公司行動、撮合、淨值、持股觸發檢查
  review_holdings: daily        # 持股每天檢查（純程式）
  review_watch: biweekly        # 觀察名單每兩週檢查
  quarterly_screen: ["02-20", "05-20", "08-20", "11-20"]   # 季度初選日（MM-DD）
  monthly_freeze: "01"         # 每月 1 日凍結 P/E 中位數

# 模型等級。每級三選一後端：
#   claude_code    ：呼叫本機 claude CLI（只需 model，可用 claude_bin 指定執行檔）
#   openai_compat  ：OpenAI 相容 API（需 base_url、api_key_env、model）
#   fake           ：假回應，僅供測試與 dry-run，不連網
models:
  strong:                       # 強：FULL_B、RED_TEAM 等
    backend: claude_code
    model: opus
    effort: medium                # 思考強度，明確傳給 claude --effort（全部統一 medium）
    timeout_s: 1800
    concurrency: 1
  medium:                       # 中：一般深度分析
    backend: claude_code
    model: sonnet
    effort: medium                # 思考強度，明確傳給 claude --effort（全部統一 medium）
    timeout_s: 1200
    concurrency: 2
  weak:                         # 弱：篩選與分流
    backend: claude_code
    model: haiku
    effort: medium                # 思考強度，明確傳給 claude --effort（全部統一 medium）
    timeout_s: 600
    concurrency: 4

# 覆寫特定工作使用的等級；未列出者依 routing/model_routing.json。
job_tier_overrides: {}          # 例：{FULL_B: strong}

budget:
  max_llm_calls_per_run: 200            # 單次執行最多模型呼叫次數
  max_cost_usd_per_run: 100             # 單次執行（一輪 run）模型費用總和上限（美元）；0＝不限
  max_input_tokens_per_run: 0           # 輸入 token 總和上限；含快取讀取，代理式多回合會放大數倍，預設 0＝不限

data:
  sec_user_agent_env: SEC_USER_AGENT    # SEC 要求的 User-Agent 環境變數名稱
  alpaca_key_env: ALPACA_API_KEY        # Alpaca API 金鑰環境變數名稱
  alpaca_secret_env: ALPACA_SECRET_KEY  # Alpaca API 密鑰環境變數名稱
  alpaca_feed: iex                      # 免費方案用 iex；付費方案用 sip
  fred_key_env: FRED_API_KEY            # FRED API 金鑰環境變數名稱

dashboard:
  host: 127.0.0.1               # 僅本機連線；遠端查看請走其他通道
  port: 8787
